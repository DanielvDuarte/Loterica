name: Atualizar resultados

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 06:00 de Brasilia, todo dia
  workflow_dispatch:        # permite rodar manualmente pelo botao "Run workflow"

permissions:
  contents: write           # para commitar index.html e os caches atualizados

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar resultados novos e reconstruir index.html
        run: python -c "import atualizar; atualizar.rebuild_all()"

      - name: Commitar e publicar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html '*.json'
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Atualiza resultados das loterias [skip ci]"
            git push
          fi
